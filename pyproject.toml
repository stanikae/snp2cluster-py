[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snp2cluster-py"
version = "1.0.0"
description = "A context-aware Python framework for Core SNP clustering and epidemiologically informed transmission-cluster detection."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Stanford Kwenda" }
]
license = { text = "Apache-2.0" }
dependencies = [
  "pyvis>=0.3.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0"
]

[project.scripts]
snp2cluster = "snp2cluster.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
